
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip PUBG_AntiCheat_Analyzer_Android_Project.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/PUBG_AntiCheat_Analyzer
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AntiCheatAnalyzer-APK
          path: extracted/PUBG_AntiCheat_Analyzer/app/build/outputs/apk/debug/app-debug.apk
